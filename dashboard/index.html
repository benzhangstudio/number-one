<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number One Dashboard</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <script>
      // Apply the saved light/dark and color choices before anything draws, so the page never flashes the wrong theme.
      try {
        var saved = localStorage.getItem("theme");
        document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
        // Color preset (🎨 button). Pink is the default and uses no attribute. Keep in sync with ACCENTS in src/theme.ts.
        var accent = localStorage.getItem("accent");
        if (["red", "orange", "gold", "green", "teal", "blue", "purple", "mono"].indexOf(accent) >= 0) {
          document.documentElement.dataset.accent = accent;
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
